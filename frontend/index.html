<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Presupuesto, cronograma y lista de compras para obras pequeñas en Cali, con APU y precios reales.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#FCFAF6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1B1814" media="(prefers-color-scheme: dark)">
  <title>Presupuesto de obra Cali</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='10' y='10' width='18' height='18' rx='5' fill='%23E8DCC6'/%3E%3Crect x='4' y='4' width='18' height='18' rx='5' fill='%238C6A43'/%3E%3C/svg%3E">
  <script>
    // Tema guardado (claro u oscuro) antes de dibujar, para que la página no parpadee.
    try { var t = localStorage.getItem("presupuesto-obra-tema"); if (t === "oscuro" || t === "claro") document.documentElement.dataset.theme = t === "oscuro" ? "dark" : "light"; } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/componentes.css">
  <link rel="stylesheet" href="css/pantallas.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <header class="barra">
    <div class="wrap">
      <button class="marca" data-ir="inicio">Presupuesto de obra</button>
      <span class="barra-der"><span class="progreso-txt" id="progreso-txt"></span><button class="tema" id="tema" data-tema="1" type="button" aria-label="Cambiar tema">◐</button></span>
    </div>
    <div class="progreso" aria-hidden="true"><i id="progreso"></i></div>
  </header>

  <main class="wrap" id="app" tabindex="-1">
    <p class="cargando">Cargando…</p>
  </main>

  <footer class="wrap" id="pie"></footer>

  <noscript><p class="wrap">Esta herramienta necesita JavaScript activado.</p></noscript>
</body>
</html>
